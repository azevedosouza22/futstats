[build]
  ignore = "node ./scripts/ignore-review-deploy.cjs"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/thesportsdb"
  to = "/.netlify/functions/thesportsdb"
  status = 200
