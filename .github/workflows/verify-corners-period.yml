name: Auditar escanteios por tempo
on:
  push:
    branches:
      - feat/verified-corners-per-half
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corner-data-tests:
    name: Conferência de eventos 1º e 2º tempo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar parser e amostras reais
        run: npx vitest run src/cornerPeriodValidation.test.ts src/wyscoutHistoricalCornerAudit.test.ts
