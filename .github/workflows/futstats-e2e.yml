name: FutStats Experimental Browser E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/futstats-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: futstats-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-flow:
    name: As Boas do Dia - navegador isolado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do PR experimental
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependências com lockfile
        run: npm ci
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Compilação e testes unitários
        run: npm run build
      - name: Testes locais do auditor de PRs (sem rede)
        run: node --test scripts/stackedPrAudit.test.mjs
      - name: Conferir cadeia DRAFT e ancestralidade dos commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-stacked-prs.mjs
      - name: Fluxo de usuário real no navegador
        run: npx playwright test e2e/good-picks-save-restore.spec.ts
      - name: PWA offline real em Chromium isolado (sem Android físico)
        run: npx playwright test e2e/offline-pwa-recovery.spec.ts
      - name: Guardar artefatos somente em falhas
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: futstats-e2e-falhas
          path: work/playwright
          retention-days: 3
