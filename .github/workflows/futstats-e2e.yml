name: FutStats Experimental Browser E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/futstats-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futstats-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-flow:
    name: As Boas do Dia - navegador isolado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do PR experimental
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependências com lockfile
        run: npm ci
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Compilação e testes unitários
        run: npm run build
      - name: Fluxo de usuário real no navegador
        run: npx playwright test e2e/good-picks-save-restore.spec.ts
      - name: Guardar artefatos somente em falhas
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: futstats-e2e-falhas
          path: work/playwright
          retention-days: 3
