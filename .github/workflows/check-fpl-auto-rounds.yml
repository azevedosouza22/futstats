name: Verificar rodadas automáticas Premier League
on:
  push:
    branches:
      - feat/fpl-auto-completed-rounds
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar rodadas e eventos
        run: npx vitest run src/fplRoundDiscovery.test.ts src/fplFreePilot.test.ts src/fplPeriodAudit.test.ts
