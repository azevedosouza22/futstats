name: CSV import validation
on:
  pull_request:
    branches: [feature/api-football-poc]
  push:
    branches: [feature/work-csv-import]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run src/workCsv.test.ts
      - run: npm run build
